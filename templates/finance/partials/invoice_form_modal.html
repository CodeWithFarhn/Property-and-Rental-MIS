<div class="modal-header" style="background:linear-gradient(135deg,#1F4E79,#2E75B6);">
  <h5 class="modal-title text-white"><i class="fas fa-file-invoice mr-2"></i>Generate Invoice</h5>
  <button type="button" class="close text-white" onclick="closeModal()">&times;</button>
</div>
<form hx-post="{% url 'finance:invoice_add' %}" hx-target="#modal-body">
  {% csrf_token %}
  <div class="modal-body">
    {% if form.non_field_errors %}
    <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
    <div class="form-group">
      <label class="font-weight-bold" style="font-size:13px;">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
      {{ field }}
      {% if field.help_text %}<small class="form-text text-muted">{{ field.help_text }}</small>{% endif %}
      {% if field.errors %}<small class="text-danger">{{ field.errors.0 }}</small>{% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="modal-footer bg-light">
    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" id="submit-invoice-btn">
      <i class="fas fa-file-invoice mr-1"></i> Generate
    </button>
  </div>
</form>
