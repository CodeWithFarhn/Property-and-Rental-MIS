{% if user.is_active %}
    <button class="btn btn-sm btn-success" hx-post="{% url 'accounts:htmx_toggle_active' user.id %}" hx-swap="outerHTML">Active</button>
{% else %}
    <button class="btn btn-sm btn-danger" hx-post="{% url 'accounts:htmx_toggle_active' user.id %}" hx-swap="outerHTML">Inactive</button>
{% endif %}
