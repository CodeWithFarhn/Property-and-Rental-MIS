{% extends 'base.html' %}
{% load static %}

{% block title %}System Settings | Property & Rental MIS{% endblock %}

{% block page_title %}Global System Settings{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div id="settings-alerts"></div>
        <div class="card card-primary card-outline">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-cogs"></i> Configuration</h3>
            </div>
            <form hx-post="{% url 'accounts:settings' %}" hx-target="#settings-alerts" hx-indicator="#save-indicator" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="card-body">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" class="form-control" name="company_name" value="Bahria Real Estate Management" required>
                    </div>
                    <div class="form-group">
                        <label>Support Email</label>
                        <input type="email" class="form-control" name="support_email" value="support@bahriarealestate.com">
                    </div>
                    <div class="form-group">
                        <label>Default Commission Rate (%)</label>
                        <input type="number" step="0.01" class="form-control" name="default_commission" value="5.00">
                    </div>
                    
                    <hr>
                    
                    <div class="form-group">
                        <label>Company Logo</label>
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" id="customFile" name="logo" onchange="previewImage(this);">
                            <label class="custom-file-label" for="customFile">Choose file</label>
                        </div>
                        <div class="mt-3">
                            <img id="logo-preview" src="#" alt="Logo Preview" style="max-height: 100px; display: none;" class="img-thumbnail"/>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary">
                        <span id="save-indicator" class="htmx-indicator"><i class="fas fa-spinner fa-spin"></i> Saving...</span>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                $('#logo-preview').attr('src', e.target.result).show();
                $(input).next('.custom-file-label').html(input.files[0].name);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
