<!-- partials/_modal_container.html
     Global HTMX modal target. All HTMX modals load their content into #modal-body.
     Alpine.js controls open/close via the modalComponent() in app.js.
-->
<div id="modal-container" x-data="modalComponent()">
  <div class="modal fade show" id="htmx-modal" tabindex="-1" role="dialog"
       x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       style="display:none;">
    <div class="modal-dialog modal-lg" role="document" @click.stop>
      <div class="modal-content shadow-lg" id="modal-body">
        <!-- HTMX loads partials here -->
        <div class="modal-header">
          <h5 class="modal-title">Loading…</h5>
          <button type="button" class="close" @click="closeModal()">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body text-center py-4">
          <i class="fas fa-spinner fa-spin fa-2x text-steel"></i>
        </div>
      </div>
    </div>
  </div>
  <!-- Backdrop -->
  <div class="modal-backdrop fade show" x-show="open" @click="closeModal()" style="display:none;"></div>
</div>

<script>
  // When HTMX loads content into #modal-body, open the modal via Alpine
  document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'modal-body') {
      const modalEl = document.getElementById('modal-container');
      if (modalEl && modalEl._x_dataStack) {
        // Use Alpine's $data to open
        Alpine.evaluate(modalEl, 'open = true');
      }
    }
  });
</script>
