<!-- partials/_modal_container.html
     Global HTMX modal target. All HTMX modals load their content into #modal-body.
     Uses a window-level custom event (mis:open-modal / mis:close-modal) so any
     button anywhere on the page can trigger the modal without sharing an Alpine scope.
-->
<div id="modal-container"
  x-data="modalComponent()"
     @mis:open-modal.window="open = true"
     @mis:close-modal.window="open = false"
  @keydown.escape.window="closeModal()">

  <!-- Backdrop -->
  <div class="modal-backdrop fade show"
       x-show="open"
       x-cloak
      @click="closeModal()"
       style="z-index:1040;">
  </div>

  <div class="modal"
       :class="{ 'd-block': open }"
       id="htmx-modal"
       tabindex="-1"
       role="dialog"
       x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 transform scale-95"
       x-transition:enter-end="opacity-100 transform scale-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       style="z-index:1050;">
    <div class="modal-dialog modal-lg" role="document" @click.stop>
      <!-- #modal-body is the HTMX swap target — the whole modal-content div -->
      <div class="modal-content shadow-lg" id="modal-body">
        <!-- Spinner placeholder shown before first HTMX load -->
        <div class="modal-header">
          <h5 class="modal-title">Loading…</h5>
          <button type="button" class="close" @click="closeModal()">&times;</button>
        </div>
        <div class="modal-body text-center py-4">
          <i class="fas fa-spinner fa-spin fa-2x text-steel"></i>
        </div>
      </div>
    </div>
  </div>
</div>
