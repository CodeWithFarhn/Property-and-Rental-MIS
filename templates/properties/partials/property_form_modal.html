<div class="modal-header" style="background:linear-gradient(135deg,#1F4E79,#2E75B6);">
  <h5 class="modal-title text-white">
    <i class="fas fa-building mr-2"></i>
    {% if property %}Edit Property{% else %}Add New Property{% endif %}
  </h5>
  <button type="button" class="close text-white" @click="closeModal()">&times;</button>
</div>
<form method="post"
      action="{% if property %}{% url 'properties:edit' property.pk %}{% else %}{% url 'properties:add' %}{% endif %}"
      hx-post="{% if property %}{% url 'properties:edit' property.pk %}{% else %}{% url 'properties:add' %}{% endif %}"
      hx-target="#modal-body"
      hx-on::after-request="if(event.detail.successful && event.detail.xhr.status===204){ closeModal(); htmx.trigger('#property-grid', 'refreshPropertyList') }">
  {% csrf_token %}
  <div class="modal-body">
    {% if form.non_field_errors %}
    <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
    <div class="form-group">
      <label class="font-weight-bold" style="font-size:13px;">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
      {{ field }}
      {% if field.errors %}<small class="text-danger">{{ field.errors.0 }}</small>{% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="modal-footer bg-light">
    <button type="button" class="btn btn-outline-secondary btn-sm" @click="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" id="save-property-btn">
      <i class="fas fa-save mr-1"></i>
      {% if property %}Save Changes{% else %}Add Property{% endif %}
    </button>
  </div>
</form>
