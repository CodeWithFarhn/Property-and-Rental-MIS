{% for unit in units %}
<option value="{{ unit.id }}"
        data-rent="{{ unit.monthly_rent }}"
        hx-get="{% url 'properties:unit_info' unit.id %}"
        hx-target="#unit-info-box"
        hx-trigger="click">
  {{ unit.unit_number }} — {{ unit.get_unit_type_display }} (PKR {{ unit.monthly_rent|floatformat:0 }}/mo)
</option>
{% empty %}
<option disabled>No vacant units in this property</option>
{% endfor %}
