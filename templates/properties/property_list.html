{% extends 'base.html' %}
{% block title %}Properties{% endblock %}
{% block page_title %}Properties{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Properties</li>{% endblock %}

{% block content %}
<div class="card card-outline card-primary shadow-sm">
  <div class="card-header d-flex align-items-center">
    <h3 class="card-title text-navy"><i class="fas fa-building mr-2"></i>Properties</h3>
    <div class="card-tools ml-auto d-flex align-items-center gap-2">
      <!-- Search -->
      <div class="input-group input-group-sm mr-2" style="width:220px;">
        <input type="text" class="form-control" id="property-search" name="q" placeholder="Search name or area…"
               hx-get="{% url 'properties:list' %}" hx-trigger="keyup changed delay:300ms"
               hx-target="#property-grid" hx-include="#property-search" />
        <div class="input-group-append">
          <span class="input-group-text"><i class="fas fa-search"></i></span>
        </div>
      </div>
      <!-- Add Property Button -->
      <button class="btn btn-primary btn-sm"
              hx-get="{% url 'properties:add' %}"
              hx-target="#modal-body"
              hx-trigger="click"
              id="add-property-btn">
        <i class="fas fa-plus mr-1"></i> Add Property
      </button>
    </div>
  </div>

  <div class="card-body">
    <div class="row" id="property-grid">
      {% include 'properties/partials/property_card_grid.html' %}
    </div>
  </div>
</div>
{% endblock %}
